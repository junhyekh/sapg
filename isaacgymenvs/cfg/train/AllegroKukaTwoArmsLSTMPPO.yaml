defaults:
  - AllegroKukaTwoArmsPPO
  - _self_

# TODO: try bigger network for two hands?
params:
  network:
    hamnet: False
    separate: True
    mlp:
      units: [768, 512, 256]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None
      cross_attn: True
    rnn:
      name: lstm
      units: 256
      layers: 1
      before_mlp: False
      # before_mlp: True
      layer_norm: False

  config:
    name: ${resolve_default:AllegroKukaTwoArmsLSTMPPO,${....experiment}}
    minibatch_size: 32768
    mini_epochs: 2